name: Publish Chat2Local release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
      - name: Verify tag matches package version
        shell: bash
        run: |
          package_version="$(python -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"])')"
          test "${GITHUB_REF_NAME}" = "v${package_version}"
      - name: Require handwritten release notes
        shell: bash
        run: |
          notes=".github/release-notes/$GITHUB_REF_NAME.md"
          test -s "$notes" || { echo "::error::Missing release notes: $notes"; exit 1; }
      - name: Build distribution
        run: uv build --no-sources
      - name: Check distribution metadata
        run: uvx --from twine twine check dist/*
      - name: Smoke test wheel
        run: uv run --isolated --no-project --with dist/*.whl chat2local --help
      - name: Smoke test source distribution
        run: uv run --isolated --no-project --with dist/*.tar.gz chat2local --help
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  windows-portable:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install frontend dependencies
        working-directory: gui/pywebview/frontend
        run: pnpm install --frozen-lockfile
      - name: Install Windows build dependencies
        run: uv sync --locked --group pywebview-gui --group desktop-build
      - name: Build Windows portable
        run: uv run --locked --group pywebview-gui --group desktop-build python scripts/build_windows.py
      - name: Archive Windows portable
        shell: pwsh
        run: |
          $target = "dist/windows/Chat2Local"
          if (-not (Test-Path "$target/Chat2Local.exe")) {
            throw "Windows build did not produce Chat2Local.exe"
          }
          New-Item -ItemType Directory -Force -Path "release-assets" | Out-Null
          $archive = Join-Path "release-assets" ("Chat2Local-" + $env:GITHUB_REF_NAME + "-windows-x64.zip")
          Compress-Archive -Path $target -DestinationPath $archive -CompressionLevel Optimal
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-portable
          path: release-assets/*.zip
          if-no-files-found: error

  publish:
    needs: [build, windows-portable]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/chat2local
    permissions:
      id-token: write
    steps:
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/
      - name: Generate PEP 740 attestations
        uses: astral-sh/attest-action@f589a42a7efb6fe400b4f400de60b4bc90390027 # v0.0.6
      - name: Publish to PyPI
        run: uv publish

  release:
    needs: [build, windows-portable, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: release-assets/python
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-portable
          path: release-assets/windows
      - name: Create GitHub Release with handwritten notes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          notes=".github/release-notes/$GITHUB_REF_NAME.md"
          test -s "$notes" || { echo "::error::Missing release notes: $notes"; exit 1; }
          gh release create "$GITHUB_REF_NAME" \
            release-assets/python/* \
            release-assets/windows/*.zip \
            --title "Chat2Local $GITHUB_REF_NAME" \
            --notes-file "$notes" \
            --verify-tag
