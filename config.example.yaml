# Chat2Local 配置示例。
#
# 复制到 ~/.chat2local/config.yaml 后修改，本文件本身不会被读取。
#
# 优先级：
#   代码内置默认值
#   ↓
#   ~/.chat2local/config.yaml
#   ↓
#   CLI 显式参数
#
# 未写出的字段使用内置默认值；未知字段会报错，避免拼写错误被静默忽略。

read:
  max_lines: 1000 # 单次最多返回行数
  max_bytes: 65536 # 单次最多返回文本大小（64 KiB）

search:
  max_results: 100 # 最大结果数，上限 500
  timeout: 10.0 # 搜索超时（秒）

process:
  shell: auto
  foreground_timeout: 10 # 秒
  stdout_buffer_limit: 1048576 # 保留最近 1 MiB（UTF-8 bytes）
  stderr_buffer_limit: 1048576
  response_output_limit: 32768 # stdout + stderr，总计 32 KiB；至少 4 bytes
  terminate_grace_period: 3 # 秒
  finished_retention: 600 # 秒；进程状态只保存在内存中

security:
  allowed_roots: [] # [] 表示只授权本次启动解析出的 default workspace。

# Hub 和 Agent 是角色，都可以运行在 Windows/Linux/macOS。
# 两个可选配置段分别用于 chat2local hub / chat2local agent；standalone 忽略它们。
# 填写对应配置并准备 token 文件后可无参数启动；不在 YAML 中保存 token 本身。
# 以下设备名和 Hub 地址均为通用示例，使用时按需替换。
# hub:
#   device_id: hub # --device-id > hub.device_id > hostname
#   host: 127.0.0.1 # --host > hub.host > 127.0.0.1
#   port: 8765 # --port > hub.port > 8765
#   token_file: ~/.chat2local/hub.token # --token > CHAT2LOCAL_HUB_TOKEN > 文件内容
#
# agent:
#   device_id: desktop # --device-id > agent.device_id > hostname
#   hub_url: wss://hub.example.com/device/ws # --hub-url > agent.hub_url；必须提供其一
#   token_file: ~/.chat2local/hub.token # --token > CHAT2LOCAL_HUB_TOKEN > 文件内容
#   proxy: system # 默认 system -> proxy=True；direct -> proxy=None；或显式代理 URL
# 例如 proxy: http://127.0.0.1:7897；支持 HTTP/HTTPS、SOCKS4/4a/5/5h。
# SOCKS 需要 python-socks[asyncio]；非法代理配置/缺少依赖时停止，不无限重连。
# 显式 URL 仅做结构校验；系统代理发现与最终解析交给 websockets connect()。
# 代理仅影响 Agent -> Hub WebSocket，不记录认证 URL，不改变 Hub/standalone 网络行为。
# 使用 --debug 启用安全连接诊断；默认 INFO，不输出认证 payload 或第三方帧日志。
# 两种角色的 token_file 都使用 UTF-8，支持 ~，读取后去除首尾空白/换行；
# 缺失、不可读、无效 UTF-8 或为空会报错，错误不会输出 token 内容。

# default workspace：
# - 显式 --workspace 时使用该目录
# - 未传 --workspace 时使用当前工作目录
# 配置多个 roots 时，default workspace 和 Tool workspace 都必须位于至少一个 allowed_root 内。
# Windows 路径使用 YAML 单引号，避免反斜杠转义。
# security:
#   allowed_roots:
#     - 'D:\Projects'
#     - 'E:\Work'
