<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>Chat2Local 浏览器连接</title>
<body>
  <h1>Chat2Local 浏览器连接</h1>
  <p>扩展 ID：<code id="extension-id"></code></p>
  <p>仅连接本机 127.0.0.1。凭据只保存在当前 Chrome 配置的本地扩展存储中。</p>
  <form id="settings">
    <p><label><input id="enabled" type="checkbox"> 启用连接</label></p>
    <p><label>Agent 端口 <input id="port" type="number" min="1" max="65535" required value="8766"></label></p>
    <p><label>独立浏览器凭据 <input id="token" type="password" autocomplete="off" minlength="32" maxlength="128" required></label></p>
    <button type="submit">保存并重新连接</button>
  </form>
  <p id="saved" role="status"></p>
  <p>连接状态：<span id="status"></span></p>
  <script src="options.js"></script>
</body>
</html>
